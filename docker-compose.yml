services:
  pr-review-server:
    build: .
    container_name: pr-review-server
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-1m}
      - SERVER_PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGENTIC_REVIEWS=${AGENTIC_REVIEWS:-false}
      - AGENT_BACKEND=${AGENT_BACKEND:-claude}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - AGENT_EFFORT=${AGENT_EFFORT:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      # Audio configuration for PulseAudio (see AUDIO_SETUP.md)
      - PULSE_SERVER=host.docker.internal
      - PULSE_COOKIE=/tmp/pulse-cookie
    ports:
      - "${SERVER_PORT:-7769}:8080"
    volumes:
      # Persistent data
      - ./reviews:/app/reviews
      - ./data:/app/data
      # Mount .gitconfig for git credentials if needed
      - ~/.gitconfig:/home/appuser/.gitconfig:ro
      # Audio: mount PulseAudio cookie for authentication
      - ~/.config/pulse/cookie:/tmp/pulse-cookie:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
