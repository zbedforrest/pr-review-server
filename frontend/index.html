<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRism</title>
    <script>
      // Apply the stored theme before the first paint, so a non-default theme
      // doesn't flash the default one while React boots. Deliberately dumb: an
      // unrecognized value simply matches no palette and leaves the `:root`
      // default in place, which useTheme() then corrects on mount. Renamed
      // themes are rewritten to their current name by loadTheme(), so this
      // only needs to know the current names.
      // The key must match THEME_STORAGE_KEY in src/utils/theme.ts.
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('prism.theme.v1');
        } catch (e) {
          // Storage blocked: fall through to the OS preference.
        }
        var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', stored || (light ? 'light' : 'dark'));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
