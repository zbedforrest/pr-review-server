<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRism</title>
    <script>
      // Apply the stored theme before the first paint, so a non-default theme
      // doesn't flash the default one while React boots. The key, the theme
      // list and the alias map mirror THEME_STORAGE_KEY, VALID_THEMES and
      // LEGACY_THEME_ALIASES in src/utils/theme.ts; theme.test.ts keeps them
      // in step.
      (function () {
        var themes = [
          'light', 'dark', 'github-light', 'github-dark', 'gruvbox-dark', 'gruvbox-light',
          'solarized-light', 'solarized-dark', 'monokai', 'dracula', 'nord', 'night-owl',
          'tokyo-night', 'catppuccin-latte', 'catppuccin-frappe', 'catppuccin-macchiato',
          'catppuccin-mocha', 'everforest', 'rose-pine', 'synthwave-84'
        ];
        var aliases = { catppuccin: 'catppuccin-mocha' };
        var stored = null;
        try {
          stored = window.localStorage.getItem('prism.theme.v1');
        } catch (e) {
          // Storage blocked: fall through to the OS preference.
        }
        if (Object.prototype.hasOwnProperty.call(aliases, stored)) stored = aliases[stored];
        if (themes.indexOf(stored) === -1) {
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          stored = light ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', stored);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
